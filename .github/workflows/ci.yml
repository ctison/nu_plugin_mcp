name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.114.1"

      - name: Run repository checks
        run: nu scripts/check.nu

  build-release-assets:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix release asset
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="nu_plugin_mcp-${{ matrix.target }}"
          mkdir -p "dist/${archive}"
          cp "target/${{ matrix.target }}/release/nu_plugin_mcp" "dist/${archive}/"
          cp README.md "dist/${archive}/"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Package Windows release asset
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "nu_plugin_mcp-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$archive" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nu_plugin_mcp.exe" "dist/$archive/"
          Copy-Item "README.md" "dist/$archive/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build-release-assets
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Create checksums
        working-directory: assets
        run: sha256sum nu_plugin_mcp-* > SHA256SUMS

      - name: Publish prerelease from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="main-${GITHUB_SHA:0:12}"
          release_title="main ${GITHUB_SHA:0:12}"
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${release_tag}" assets/* \
            --generate-notes \
            --latest=false \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "${release_title}"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag
