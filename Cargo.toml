[package]
name = "nu_plugin_mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Run MCP servers backed by Nushell closures"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
jsonschema = { version = "0.49.8", default-features = false }
nu-plugin = "0.114.1"
nu-protocol = "0.114.1"
rust-mcp-axum = "1.0.1"
rust-mcp-sdk = { version = "1.0.1", default-features = false, features = ["server", "stdio"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Match the local-socket feature enabled by nu-plugin when compiling the Nushell test harness.
nu-plugin-engine = { version = "0.114.1", features = ["local-socket"] }
nu-plugin-test-support = "0.114.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
